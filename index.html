<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>imposter لعبة</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg,#071124 0%, #0d2130 100%);
            color: #e6eef6;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 16px;
            min-height: 100vh;
        }

        .page {
            display: none;
            padding: 15px;
            max-width: 100%;
            overflow-x: hidden;
        }

        .active {
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            margin: 15px 0;
        }

        .big {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        input, textarea {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1e2a44;
            width: 95%;
            max-width: 500px;
            background: #0f172a;
            color: #e6eef6;
            font-size: 18px;
            margin: 10px auto;
            display: block;
        }

        button {
            padding: 18px 30px;
            margin: 12px 8px;
            border-radius: 10px;
            border: none;
            background: #06b6d4;
            color: #012;
            cursor: pointer;
            font-size: 20px;
            width: 90%;
            max-width: 400px;
            min-height: 60px;
        }

        ul {
            padding: 0;
            margin: 20px auto;
            max-width: 500px;
        }

        li {
            list-style: none;
            padding: 12px;
            margin: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 95%;
            max-width: 500px;
            font-size: 18px;
        }

        th, td {
            border: 1px solid #06b6d4;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #012;
            font-size: 20px;
        }

        td {
            background-color: #0f172a;
        }

        #playersList li {
            margin: 10px auto;
            padding: 15px;
            font-size: 22px;
        }

        @media screen and (max-width: 480px) {
            body {
                font-size: 14px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .big {
                font-size: 1.3rem;
            }
            
            button {
                padding: 16px 25px;
                font-size: 18px;
                min-height: 55px;
            }
            
            input, textarea {
                font-size: 16px;
                padding: 12px;
            }
            
            table {
                font-size: 16px;
            }
        }

        @media screen and (min-width: 768px) {
            .page {
                padding: 25px;
            }
            
            button {
                width: auto;
                min-width: 200px;
            }
            
            input, textarea {
                width: 80%;
            }
        }
    </style>
</head>
<body>

<div id="home" class="page active">
    <h1>لعبة imposter </h1>
    <input id="playerName" placeholder="أدخل اسم اللاعب"><br><br>
    <button onclick="addPlayer()">إضافة لاعب</button>
    <ul id="playersList"></ul>
    <button onclick="startGame()">بدء اللعبة</button>
</div>

<!-- الصفحة الأولى: صفحة بدء الدور -->
<div id="startTurnPage" class="page">
    <div class="big">الدور على: <span id="currentTurnPlayer"></span></div>
    <button onclick="showPlayerTool()">التالي</button>
</div>

<!-- الصفحة الثانية: صفحة عرض الغرض -->
<div id="showToolPage" class="page">
    <div class="big" id="playerToolText"></div>
    <button onclick="goToNextPlayer()">موافق</button>
</div>

<!-- الصفحة الثالثة: صفحة اللاعب التالي -->
<div id="nextPlayerPage" class="page">
    <div class="big" id="nextPlayerName"></div>
    <button onclick="continueToNextPlayer()">استمرار</button>
</div>

<!-- الصفحة الرابعة: صفحة طلب المعلومات -->
<div id="infoPage" class="page">
    <div class="big" id="playerInfoText"></div>
    <button onclick="showNextInfoPlayer()">التالي</button>
</div>

<!-- الصفحة الخامسة: صفحة اللاعب التالي للمعلومات -->
<div id="nextInfoPage" class="page">
    <div class="big" id="nextInfoPlayer"></div>
    <button onclick="continueToNextInfoPlayer()">استمرار</button>
</div>

<div id="votePage" class="page">
    <div id="voteTitle" class="big"></div>
    <ul id="voteList"></ul>
</div>

<div id="impostorGuess" class="page">
    <div class="big" id="impostorNameShow"></div>
    <input id="guessInput" placeholder="اكتب توقعك">
    <button onclick="submitGuess()">إرسال</button>
</div>

<div id="scorePage" class="page">
    <h2>النقاط</h2>
    <table>
        <thead><tr><th>اللاعب</th><th>النقاط</th></tr></thead>
        <tbody id="scoreTable"></tbody>
    </table>
    <button onclick="newGame()">لعبة جديدة</button>
</div>

<script>
    const toolPairs = [
       ["هواء","ماء"],
["ماء","كوب"],
["نار","طبخ"],
["شمس","حر"],
["قمر","ليل"],

["مطر","أرض"],
["بحر","سمك"],
["نهر","جسر"],
["رمل","قدم"],
["تراب","زرع"],

["بيت","باب"],
["باب","مفتاح"],
["نافذة","هواء"],
["غرفة","سرير"],
["مطبخ","أكل"],

["كرسي","جلوس"],
["طاولة","صحن"],
["كوب","شاي"],
["ملعقة","شوربة"],
["سكين","خبز"],

["قلم","ورقة"],
["كتاب","قراءة"],
["دفتر","واجب"],
["مدرسة","طلاب"],
["سبورة","شرح"],

["معلم","درس"],
["طالب","كتاب"],
["اختبار","قلم"],
["نجاح","فرح"],
["رسوب","حزن"],

["سيارة","طريق"],
["شارع","إشارة"],
["دراجة","خوذة"],
["باص","ركاب"],
["موقف","سيارة"],

["هاتف","شحن"],
["شاحن","كهرباء"],
["تلفاز","قناة"],
["ريموت","زر"],
["سماعة","صوت"],

["ساعة","وقت"],
["منبه","صباح"],
["تقويم","يوم"],
["ليل","نوم"],
["صباح","قهوة"],

["قهوة","فنجان"],
["شاي","سكر"],
["عصير","ثلج"],
["ماء","عطش"],
["طعام","جوع"],

["فاكهة","تفاح"],
["خضار","سلطة"],
["خبز","فرن"],
["رز","طبخ"],
["دجاج","شواء"],

["ملابس","دولاب"],
["قميص","زر"],
["حذاء","قدم"],
["جوارب","غسل"],
["قبعة","شمس"],

["حمام","صابون"],
["مغسلة","ماء"],
["منشفة","نشاف"],
["مرآة","وجه"],
["مشط","شعر"],

["حديقة","شجر"],
["شجر","ظل"],
["ورد","رائحة"],
["عشب","أرض"],
["ملعب","كرة"],

["كرة","لعب"],
["هدف","فوز"],
["فريق","مباراة"],
["حكم","صفارة"],
["تمرين","تعب"],

["سوق","شراء"],
["محل","بضاعة"],
["كاشير","فلوس"],
["فاتورة","دفع"],
["كرت","حساب"],

["فلوس","محفظة"],
["بنك","حساب"],
["راتب","شهر"],
["عمل","تعب"],
["إجازة","راحة"],

["طبيب","مريض"],
["مستشفى","علاج"],
["دواء","شفاء"],
["صيدلية","دواء"],
["حرارة","ميزان"],

["شرطة","أمن"],
["إشارة","وقوف"],
["مخالفة","غرامة"],
["قانون","نظام"],
["طابور","انتظار"],

["سفر","شنطة"],
["مطار","طائرة"],
["طائرة","سفر"],
["فندق","نوم"],
["غرفة","مفتاح"],

["بحر","سباحة"],
["مسبح","ماء"],
["نظارة","شمس"],
["كريم","حماية"],
["عطلة","راحة"],

["صديق","حديث"],
["جلسة","قهوة"],
["ضحك","فرح"],
["حكاية","سمر"],
["صورة","ذكرى"],

["بيت","عائلة"],
["أم","حنان"],
["أب","تعب"],
["أخ","لعب"],
["أخت","حديث"],

["طفل","لعبة"],
["لعبة","متعة"],
["كرتون","تلفاز"],
["واجب","بيت"],
["نوم","راحة"],
    ];

    // المتغيرات الأصلية
    let players = [];
    let playerPoints = {};
    let chosenPair = [];
    let storyTool = "";
    let impostorTool = "";
    let impostorIndex = -1;

    // المتغيرات الجديدة
    let playerOrder = [];
    let currentPlayerIndex = 0;
    let allPlayersSawTools = false; // هل جميع اللاعبين شافوا أغراضهم؟
    let infoPlayerIndex = 0; // مؤشر للاعبين في مرحلة إعطاء المعلومات

    // الصفحة الرئيسية
    function addPlayer(){
        const name = playerName.value.trim();
        if(!name) return;
        players.push(name);
        if(!(name in playerPoints)) playerPoints[name] = 0;
        updatePlayerList();
        playerName.value = "";
    }
    
    function updatePlayerList(){
        playersList.innerHTML = "";
        players.forEach(p => { 
            const li = document.createElement("li"); 
            li.textContent = p; 
            playersList.appendChild(li); 
        });
    }

    // 🔥 الدوال الجديدة
    
    // خلط اللاعبين عشوائياً
    function shufflePlayers() {
        playerOrder = [...players];
        for(let i = playerOrder.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [playerOrder[i], playerOrder[j]] = [playerOrder[j], playerOrder[i]];
        }
        currentPlayerIndex = 0;
        infoPlayerIndex = 0;
        allPlayersSawTools = false;
    }

    // بدء دور اللاعب لرؤية الغرض
    function startPlayerTurn() {
        if(currentPlayerIndex >= playerOrder.length) {
            // انتهى جميع اللاعبين من رؤية الأغراض
            allPlayersSawTools = true;
            startGivingInfo(); // ابدأ مرحلة إعطاء المعلومات
            return;
        }
        
        const currentPlayer = playerOrder[currentPlayerIndex];
        document.getElementById("currentTurnPlayer").textContent = currentPlayer;
        showSection("startTurnPage");
    }

    // عرض الغرض للاعب
    function showPlayerTool() {
        const currentPlayer = playerOrder[currentPlayerIndex];
        const isImpostor = (currentPlayer === players[impostorIndex]);
        const tool = isImpostor ? impostorTool : storyTool;
        
        document.getElementById("playerToolText").textContent = 
            `يا ${currentPlayer}، غرضك هو: ${tool}`;
        
        showSection("showToolPage");
    }

    // الانتقال للاعب التالي (لرؤية الأغراض)
    function goToNextPlayer() {
        const nextIndex = currentPlayerIndex + 1;
        
        if(nextIndex < playerOrder.length) {
            const nextPlayer = playerOrder[nextIndex];
            document.getElementById("nextPlayerName").textContent = 
                `اللاعب التالي: ${nextPlayer}`;
            showSection("nextPlayerPage");
        } else {
            document.getElementById("nextPlayerName").textContent = 
                "انتهى جميع اللاعبين من رؤية الأغراض، ستبدأ مرحلة إعطاء المعلومات";
            showSection("nextPlayerPage");
        }
    }

    // استمرار للاعب التالي
    function continueToNextPlayer() {
        currentPlayerIndex++;
        if(currentPlayerIndex < playerOrder.length) {
            // ابدأ بدور اللاعب التالي لرؤية الغرض
            startPlayerTurn();
        } else {
            // انتهى الجميع من رؤية الأغراض
            allPlayersSawTools = true;
            startGivingInfo();
        }
    }

    // 🔥 بدء مرحلة إعطاء المعلومات (بعد ما الكل شاف أغراضهم)
    function startGivingInfo() {
        infoPlayerIndex = 0;
        showPlayerInfoPage();
    }

    // عرض صفحة طلب المعلومات
    function showPlayerInfoPage() {
        if(infoPlayerIndex >= playerOrder.length) {
            // انتهى جميع اللاعبين من إعطاء المعلومات
            startVoting();
            return;
        }
        
        const currentPlayer = playerOrder[infoPlayerIndex];
        document.getElementById("playerInfoText").textContent = 
            `يا ${currentPlayer}، عط معلومة عن الشيء`;
        showSection("infoPage");
    }

    // الانتقال للاعب التالي في مرحلة المعلومات
    function showNextInfoPlayer() {
        const nextIndex = infoPlayerIndex + 1;
        
        if(nextIndex < playerOrder.length) {
            const nextPlayer = playerOrder[nextIndex];
            document.getElementById("nextInfoPlayer").textContent = 
                `اللاعب التالي: ${nextPlayer}`;
            showSection("nextInfoPage");
        } else {
            document.getElementById("nextInfoPlayer").textContent = 
                "انتهى دور جميع اللاعبين، سيبدأ التصويت الآن";
            showSection("nextInfoPage");
        }
    }

    // استمرار للاعب التالي في مرحلة المعلومات
    function continueToNextInfoPlayer() {
        infoPlayerIndex++;
        if(infoPlayerIndex < playerOrder.length) {
            // ابدأ باللاعب التالي
            showPlayerInfoPage();
        } else {
            // انتهى الجميع، ابدأ التصويت
            startVoting();
        }
    }

    // بدء اللعبة
    function startGame(){
        if(players.length < 3){ 
            alert("لازم 3 لاعبين على الأقل"); 
            return; 
        }
        
        // اختيار الزوج والأمبوستر
        chosenPair = toolPairs[Math.floor(Math.random() * toolPairs.length)];
        impostorIndex = Math.floor(Math.random() * players.length);
        
        if(Math.random() < 0.5){ 
            storyTool = chosenPair[0]; 
            impostorTool = chosenPair[1]; 
        } else { 
            storyTool = chosenPair[1]; 
            impostorTool = chosenPair[0]; 
        }
        
        // خلط اللاعبين وبدء الدورة
        shufflePlayers();
        startPlayerTurn(); // ابدأ بالصفحة الأولى لرؤية الأغراض
    }

    // عرض الصفحة
    function showSection(id){ 
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active")); 
        document.getElementById(id).classList.add("active"); 
    }

    // التصويت
    let voteTurn = 0;
    let voteChosen = {};
    
    function startVoting(){ 
        voteTurn = 0; 
        voteChosen = {}; 
        showVoteTurn(); 
        showSection("votePage"); 
    }

    function showVoteTurn(){
        voteList.innerHTML = "";
        if(voteTurn >= players.length){ 
            showVoteResult(); 
            return; 
        }
        
        let voter = players[voteTurn];
        voteTitle.textContent = `${voter}، تبي تصوت على منو؟`;
        
        players.forEach(p => {
            if(p !== voter){
                const li = document.createElement("li");
                li.textContent = p;
                li.onclick = () => {
                    voteChosen[p] = voteChosen[p] || [];
                    voteChosen[p].push(voter);
                    voteTurn++;
                    showVoteTurn();
                };
                voteList.appendChild(li);
            }
        });
    }

    // نتيجة التصويت
    function showVoteResult(){
        alert("الأمبوستر هو: " + players[impostorIndex]);

        // توزيع النقاط
        for(let target in voteChosen){
            voteChosen[target].forEach(voter => {
                if(voter === players[impostorIndex]) return;
                if(target === players[impostorIndex]){
                    playerPoints[voter] += 100;
                }
            });
        }

        impostorNameShow.textContent = `${players[impostorIndex]}، حاول توقع السالفة`;
        showSection("impostorGuess");
    }

    // تخمين الأمبوستر
    function submitGuess(){
        const guess = document.getElementById("guessInput").value.trim();
        if(guess === storyTool){
            playerPoints[players[impostorIndex]] += 100;
        }
        showScores();
    }

    // عرض النقاط
    function showScores(){
        scoreTable.innerHTML = "";
        for(let p of players){
            const tr = document.createElement("tr");
            const tdName = document.createElement("td"); 
            tdName.textContent = p;
            const tdPoints = document.createElement("td"); 
            tdPoints.textContent = playerPoints[p] || 0;
            tr.appendChild(tdName); 
            tr.appendChild(tdPoints);
            scoreTable.appendChild(tr);
        }
        showSection("scorePage");
    }

    // لعبة جديدة
    function newGame(){
        voteTurn = 0; 
        voteChosen = {}; 
        impostorIndex = -1;
        currentPlayerIndex = 0;
        infoPlayerIndex = 0;
        playerOrder = [];
        allPlayersSawTools = false;
        showSection("home"); 
        updatePlayerList();
        document.getElementById("guessInput").value = "";
    }
</script>

</body>
</html>
